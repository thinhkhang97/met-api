services:
  db:
    image: postgres:14.2
    ports:
      - '5432:5432'
    volumes:
      - 'lunch-together-postgres:/var/modules/lunch-together/postgresql'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
  cache:
    image: redis:alpine
    container_name: met-redis
    ports:
      - "6379:6379"
    volumes:
      - "met-redis:/data"
volumes:
  lunch-together-postgres:
  met-redis: