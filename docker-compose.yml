services:
  db:
    image: postgres:14.2
    ports:
      - '5432:5432'
    volumes:
      - 'lunch-together-postgres:/var/modules/lunch-together/postgresql'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
  cache:
    image: redis:alpine
    container_name: met-redis
    ports:
      - "6379:6379"
    volumes:
      - "met-redis:/data"
  rabbitmq:
    image: rabbitmq:3.12
    container_name: rabbitmq
    hostname: rabbitmq
    volumes:
      - "rabbitmq:/var/lib/rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
volumes:
  lunch-together-postgres:
  met-redis:
  rabbitmq: